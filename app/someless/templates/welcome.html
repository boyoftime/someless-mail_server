{% extends "base.html" %}
{% block head %}
  <noscript><meta http-equiv="refresh" content="6; url={{ url_for('auth.login') }}"></noscript>
  <noscript><style>body.splash .loading-bar-fill { width: 100%; } .splash-title span { opacity: 1; }</style></noscript>
{% endblock %}
{% block title %}Welcome to Someless Mail Server{% endblock %}
{% block body_class %}splash{% endblock %}
{% block body %}
<main class="splash-main" data-next="{{ url_for('auth.login') }}"
      data-preload="{% for file in login_page_files %}{{ url_for('static', filename=file) }}{% if not loop.last %} {% endif %}{% endfor %}">
  <div id="splash-animation" class="splash-animation" data-src="{{ url_for('static', filename='lottie/loading.json') }}" aria-hidden="true"></div>
  <h1 class="splash-title">
    <span>Welcome</span> <span>to</span> <span>Someless</span> <span>Mail</span> <span>Server</span>
  </h1>
</main>
<footer class="splash-footer">Someless Mail {{ version }}</footer>
<script src="{{ url_for('static', filename='js/lottie_light.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/splash.js') }}"></script>
{% endblock %}
