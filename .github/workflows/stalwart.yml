# The mail engine, Stalwart, built from source without its Enterprise parts, for both kinds of
# server (amd64 and arm64, each on its own machine: compiling Rust under emulation would take
# hours). The main image copies it from ghcr.io/boyoftime/someless-stalwart:<version>.
# Runs by hand (Actions > Build Stalwart (open source) > Run workflow), or when stalwart/ changes.
name: Build Stalwart (open source)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [stalwart/**]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/boyoftime/someless-stalwart

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: version
        run: echo "version=$(cat stalwart/VERSION)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: stalwart
          platforms: ${{ matrix.platform }}
          build-args: STALWART_VERSION=${{ steps.version.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=stalwart-${{ matrix.runner }}
          cache-to: type=gha,mode=max,scope=stalwart-${{ matrix.runner }}

      - name: Keep the digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v5
        with:
          name: digest-${{ matrix.runner }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v5
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: One tag for both
        run: |
          version=$(cat stalwart/VERSION)
          cd /tmp/digests
          docker buildx imagetools create -t "$IMAGE:$version" $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$version"
